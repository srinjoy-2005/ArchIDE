name: "📋 Task / Chore"
description: "Track an engineering chore, refactoring, or technical debt task"
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for internal tasks, technical debt, dependencies, or chore work.
  - type: textarea
    id: description
    attributes:
      label: "Task Description"
      description: "Detailed description of the task."
      placeholder: "e.g., Refactor compiler AST emitter to support..."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: "Acceptance Criteria"
      description: "Checklist of criteria to mark this task complete."
      placeholder: |
        - [ ] All unit tests pass
        - [ ] Types validated
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Component Area"
      options:
        - "area:frontend"
        - "area:backend"
        - "area:compiler"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "priority:high"
        - "priority:medium"
        - "priority:low"
    validations:
      required: false
