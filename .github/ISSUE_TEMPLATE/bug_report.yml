name: "🐛 Bug Report"
description: "File a bug report or regression in ArchIDE"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., When exporting PyTorch code, the variable name shadows built-in function..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open canvas
        2. Drag node '...'
        3. Connect to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Relevant Code, Files, or Logs"
      description: "Link to files, components, stack traces, or console logs if available."
      placeholder: "src/components/..., backend/blocks/..., etc."
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: "Component Area"
      options:
        - "area:frontend"
        - "area:backend"
        - "area:compiler"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "priority:high"
        - "priority:medium"
        - "priority:low"
    validations:
      required: false
