name: ArchIDE CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (PyTest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest httpx

      - name: Run Backend PyTest
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

  changelog-check:
    name: Changelog Verification Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Changelog Updated on Code Changes
        run: |
          # Check if backend or src files changed in this PR
          CHANGED_CODE=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '^(backend/|src/)' || true)
          CHANGED_CHANGELOG=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '^docs/changelog/' || true)

          if [ -n "$CHANGED_CODE" ] && [ -z "$CHANGED_CHANGELOG" ]; then
            echo "::warning title=Changelog Missing::Code changes detected in backend/ or src/ without an accompanying update to docs/changelog/. Please ask agent to generate sync changes or run 'python scripts/sync.py' or update today's changelog before merging!"
          else
            echo "Changelog verification passed."
          fi

  ci-gate:
    name: CI Pipeline Status Check (All Tests Required)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: always()
    steps:
      - name: Verify All Required Jobs Passed
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed! Commit cannot be merged to main."
            exit 1
          fi
          echo "All required tests and build checks passed successfully."
